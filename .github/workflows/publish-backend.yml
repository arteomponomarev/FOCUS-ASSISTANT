name: Publish reviewed backend image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected commit to the repository GHCR namespace
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: container-registry
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require passing CI on the selected commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deployment/check-release-ci.sh "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Focus.Web/package-lock.json
      - name: Build the same-origin SPA for the reviewed commit
        working-directory: Focus.Web
        run: |
          npm ci
          VITE_API_BASE_URL=/ npm run build
      - name: Derive canonical registry image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build --pull --platform linux/amd64 -t "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit tag and record the registry digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE" | tee "$RUNNER_TEMP/focus-image-push.log"
          digest=$(awk '$2 == "digest:" { print $3 }' "$RUNNER_TEMP/focus-image-push.log")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="${IMAGE%:*}@$digest"
          docker pull "$image"
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          [[ "$revision" == "$GITHUB_SHA" ]]
          jq -n --arg sha "$GITHUB_SHA" --arg image "$image" --arg run "$GITHUB_RUN_ID" \
            '{source_sha: $sha, image: $image, publication_run: $run}' > release.json
          printf 'Commit: `%s`\n\nDeployment image: `%s@%s`\n' \
            "$GITHUB_SHA" "${IMAGE%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: Focus.Web/dist/
          if-no-files-found: error
          retention-days: 30
